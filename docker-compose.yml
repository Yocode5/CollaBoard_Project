services:

  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      CLIENT_ORIGIN: http://localhost:9090
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ""
    ports:
      - "9090:80"
    depends_on:
      - server